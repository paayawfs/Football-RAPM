[project]
name = "rapm"
version = "0.1.0"
description = "Five substitutions and RAPM identifiability in football"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "pyarrow>=16",
    "requests>=2.32",
    "requests-cache>=1.2",
    "statsbombpy>=1.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rapm"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
